name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint with flake8
        run: python -m flake8 backend

      - name: Verify model loads
        run: python -c "import joblib; joblib.load('message_classifier.joblib')"

      - name: Start API and smoke test
        run: |
          uvicorn main:app --app-dir backend --port 8000 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              break
            fi
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"text":"Congratulations! You won a free prize, claim now"}'
          curl -fsS -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"text":"Hey, are we still meeting for lunch tomorrow?"}'

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root tooling
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint with ESLint
        run: npm run lint:frontend

      - name: Typecheck
        run: npm run typecheck:frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
